  <style>
/* =========================================================
   SNEL11 — Design System tokens
   ========================================================= */

@font-face {
  font-family: "Inter";
  src: url("LP_SNEL_5_Emissao/fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype-variations");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Inter";
  src: url("LP_SNEL_5_Emissao/fonts/Inter-Italic-VariableFont_opsz_wght.ttf") format("truetype-variations");
  font-weight: 100 900;
  font-style: italic;
  font-display: swap;
}
@font-face {
  font-family: "Roboto Flex";
  src: url("LP_SNEL_5_Emissao/fonts/RobotoFlex-VariableFont_GRAD_XOPQ_XTRA_YOPQ_YTAS_YTDE_YTFI_YTLC_YTUC_opsz_slnt_wdth_wght.ttf") format("truetype-variations");
  font-weight: 100 1000;
  font-stretch: 25% 151%;
  font-style: oblique -10deg 0deg;
  font-display: swap;
}

:root {
  --snel-blue-50:   #F5F7FC;
  --snel-blue-100:  #E1E8F3;
  --snel-blue-200:  #CFE3FD;
  --snel-blue-400:  #2362C9;
  --snel-blue-900:  #0D184D;
  --snel-sun-500:   #FABE1E;
  --snel-sun-600:   #FE8E23;
  --snel-neutral-300: #A0ABB9;
  --snel-neutral-100: #E1E8F3;

  --bg-page:        var(--snel-blue-50);
  --bg-surface:     #FFFFFF;
  --bg-raised:      #FFFFFF;
  --bg-tint:        var(--snel-blue-200);
  --bg-inverse:     var(--snel-blue-900);

  --fg-1:           var(--snel-blue-900);
  --fg-2:           #3A4566;
  --fg-3:           var(--snel-neutral-300);
  --fg-on-inverse:  #FFFFFF;
  --fg-on-accent:   #FFFFFF;

  --border-1:       var(--snel-blue-100);
  --border-2:       #D5DEEC;
  --border-strong:  var(--snel-blue-900);

  --accent:         var(--snel-blue-400);
  --accent-strong:  var(--snel-blue-900);
  --accent-on-dark: var(--snel-sun-500);
  --warning:        var(--snel-sun-600);
  --success:        #1FA971;
  --danger:         #E0413E;

  --font-display: "Roboto Flex", "Roboto", system-ui, -apple-system, sans-serif;
  --font-body:    "Inter", system-ui, -apple-system, sans-serif;
  --font-mono:    ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --fs-display: 64px;
  --fs-h1:      48px;
  --fs-h2:      36px;
  --fs-h3:      28px;
  --fs-h4:      22px;
  --fs-lg:      18px;
  --fs-body:    16px;
  --fs-sm:      14px;
  --fs-xs:      12px;

  --lh-tight:   1.05;
  --lh-snug:    1.20;
  --lh-normal:  1.45;
  --lh-loose:   1.65;

  --tracking-tight:  -0.02em;
  --tracking-snug:   -0.01em;
  --tracking-normal:  0em;
  --tracking-wide:    0.04em;
  --tracking-wider:   0.08em;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-24: 96px;

  --r-xs:   4px;
  --r-sm:   8px;
  --r-md:   12px;
  --r-lg:   16px;
  --r-xl:   24px;
  --r-2xl:  32px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(13, 24, 77, 0.04), 0 1px 1px rgba(13, 24, 77, 0.03);
  --shadow-2: 0 4px 12px rgba(13, 24, 77, 0.06), 0 2px 4px rgba(13, 24, 77, 0.04);
  --shadow-3: 0 12px 32px rgba(13, 24, 77, 0.10), 0 4px 8px rgba(13, 24, 77, 0.05);
  --shadow-glow-blue: 0 0 0 4px rgba(96, 156, 252, 0.18);
  --shadow-glow-yellow: 0 0 0 4px rgba(250, 190, 30, 0.25);

  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-fast: 120ms;
  --dur-med:  220ms;
  --dur-slow: 420ms;
}

html, body {
  background: var(--bg-page);
  color: var(--fg-1);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { overflow-x: hidden; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

.container {
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding-inline: var(--space-6);
}
.container--wide { max-width: 1360px; }

.section {
  padding-block: clamp(var(--space-8), 4.5vw, var(--space-12));
  position: relative;
}
.section--tight {
  padding-block: clamp(var(--space-6), 3vw, var(--space-8));
}
.section--ink {
  background: var(--snel-blue-900);
  color: var(--fg-on-inverse);
}
.section--ink h2, .section--ink h3, .section--ink h4, .section--ink .display { color: #fff; }
.section--ink p { color: rgba(255,255,255,0.72); }
.section--soft { background: var(--snel-blue-50); }

.eyebrow-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-3);
  padding: 4px 0;
}
.eyebrow-tag--accent { color: var(--snel-blue-400); }

.h-display {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(40px, 5.4vw, 76px);
  line-height: 0.98;
  letter-spacing: -0.025em;
  color: var(--snel-blue-900);
  margin: 0;
  text-wrap: balance;
}
.section--ink .h-display { color: #fff; }
.h-section {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(32px, 3.4vw, 52px);
  line-height: 1.02;
  letter-spacing: -0.022em;
  color: var(--snel-blue-900);
  margin: 0;
  text-wrap: balance;
}
.h-section .accent { color: var(--snel-sun-500); }
.lede {
  font-family: var(--font-body);
  font-size: clamp(16px, 1.2vw, 19px);
  line-height: 1.55;
  color: var(--fg-2);
  max-width: 62ch;
}
.section--ink .lede { color: rgba(255,255,255,0.72); }
.subtle {
  font-size: 13px;
  color: var(--fg-3);
  line-height: 1.5;
}

/* buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  padding: 14px 26px;
  border-radius: var(--r-pill);
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-out),
              background var(--dur-med) var(--ease-out),
              box-shadow var(--dur-med) var(--ease-out),
              color var(--dur-med) var(--ease-out);
  line-height: 1;
  white-space: nowrap;
  text-decoration: none;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn--primary {
  background: #2ABD74;
  color: #fff;
  box-shadow: 0 6px 16px rgba(42,189,116,0.28);
}
.btn--primary:hover { background: #229E61; box-shadow: 0 10px 28px rgba(42,189,116,0.36); }
.btn--sun {
  background: #2ABD74;
  color: #fff;
  box-shadow: 0 6px 16px rgba(42,189,116,0.28);
}
.btn--sun:hover { background: #229E61; box-shadow: 0 10px 28px rgba(42,189,116,0.36); }
.btn--ghost {
  background: transparent;
  color: var(--snel-blue-900);
  border-color: var(--snel-blue-900);
}
.btn--ghost:hover { background: var(--snel-blue-900); color: #fff; }
.section--ink .btn--ghost { color: #fff; border-color: rgba(255,255,255,0.6); }
.section--ink .btn--ghost:hover { background: #fff; color: var(--snel-blue-900); }
.btn--lg { padding: 17px 32px; font-size: 16px; }
.btn--xl { padding: 20px 36px; font-size: 17px; }
.btn-arrow {
  display: inline-grid; place-items: center;
  width: 22px; height: 22px;
  border-radius: 999px;
  background: rgba(255,255,255,0.18);
  margin-left: 2px;
}

/* alert bar */
.alert-bar {
  background: var(--snel-sun-500);
  color: var(--snel-blue-900);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.alert-bar__inner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 11px 24px;
  text-align: center;
}

/* header */
.site-header {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(12px);
  background: rgba(245, 247, 252, 0.85);
  border-bottom: 1px solid var(--border-1);
}
.site-header__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  gap: var(--space-8);
}
.site-header__brand { display: flex; align-items: center; gap: 14px; }
.site-header__brand img { height: 28px; }
.site-header__nav {
  display: flex;
  align-items: center;
  gap: 28px;
}
.site-header__nav a {
  font-size: 14px;
  font-weight: 500;
  color: var(--fg-2);
  transition: color var(--dur-fast);
}
.site-header__nav a:hover { color: var(--snel-blue-900); }
.site-header__cta { display: flex; gap: 10px; align-items: center; }
@media (max-width: 880px) { .site-header__nav { display: none; } }

/* before/after compare */
.compare {
  background: #fff;
  border-radius: var(--r-2xl);
  padding: clamp(28px, 4vw, 56px);
  box-shadow: var(--shadow-1);
  border: 1px solid var(--border-1);
}
.compare__head {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;
  gap: 24px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border-1);
}
.compare__head-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-3);
  align-self: end;
}
.compare__head-now {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--snel-blue-900);
  font-size: 20px;
}
.compare__head-after {
  font-family: var(--font-display);
  font-weight: 800;
  color: var(--snel-blue-400);
  font-size: 20px;
}
.compare__row {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;
  gap: 24px;
  padding: 24px 0;
  border-bottom: 1px solid var(--border-1);
  align-items: center;
}
.compare__row:last-child { border-bottom: none; }
.compare__metric { display: flex; flex-direction: column; gap: 4px; }
.compare__metric-label {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--snel-blue-900);
  font-size: 17px;
}
.compare__metric-help { font-size: 13px; color: var(--fg-3); line-height: 1.4; }
.compare__now, .compare__after {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(28px, 2.6vw, 36px);
  letter-spacing: -0.02em;
  line-height: 1;
}
.compare__now { color: var(--fg-3); }
.compare__after {
  color: var(--snel-blue-900);
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.compare__after .delta {
  font-size: 12px;
  color: var(--snel-sun-600);
  font-weight: 600;
  margin-left: 4px;
}
@media (max-width: 720px) {
  .compare__head, .compare__row { grid-template-columns: 1fr 1fr; }
  .compare__head-label, .compare__metric { grid-column: 1 / -1; }
}

/* cronograma */
.cronograma {
  position: relative;
  padding-left: 40px;
}
.cronograma::before {
  content: '';
  position: absolute;
  left: 30px; top: 12px; bottom: 12px;
  width: 2px;
  background: var(--snel-blue-100);
}
.crono-step {
  position: relative;
  padding: 20px 0 20px 32px;
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 32px;
  align-items: start;
}
.crono-step::before {
  content: '';
  position: absolute;
  left: -17px; top: 26px;
  width: 14px; height: 14px;
  border-radius: 999px;
  background: #fff;
  border: 3px solid var(--snel-blue-400);
  z-index: 1;
}
.crono-step--current::before {
  background: var(--snel-sun-500);
  border-color: var(--snel-sun-600);
  box-shadow: 0 0 0 6px rgba(250,190,30,0.18);
}
.crono-step__date {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  color: var(--snel-blue-900);
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap;
}
.crono-step__tag {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  background: var(--snel-blue-50);
  color: var(--snel-blue-400);
}
.crono-step--current .crono-step__tag {
  background: var(--snel-sun-500);
  color: var(--snel-blue-900);
}
.crono-step__body { display: flex; flex-direction: column; gap: 6px; }
.crono-step__title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 19px;
  color: var(--snel-blue-900);
  letter-spacing: -0.01em;
}
.crono-step__desc {
  font-size: 14px;
  color: var(--fg-2);
  line-height: 1.55;
}
@media (max-width: 760px) {
  .crono-step { grid-template-columns: 1fr; gap: 8px; }
}

/* final CTA */
.final-cta {
  background: var(--snel-blue-900);
  color: #fff;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.final-cta::before, .final-cta::after {
  content: '';
  position: absolute;
  border-radius: 999px;
  pointer-events: none;
}
.final-cta::before {
  width: 480px; height: 480px;
  background: radial-gradient(circle, rgba(96,156,252,0.32), transparent 70%);
  top: -180px; right: -120px;
}
.final-cta::after {
  width: 360px; height: 360px;
  background: radial-gradient(circle, rgba(250,190,30,0.28), transparent 70%);
  bottom: -140px; left: -80px;
}
.final-cta__inner {
  position: relative; z-index: 2;
  padding-block: clamp(64px, 8vw, 120px);
  max-width: 920px;
  margin: 0 auto;
  text-align: center;
}
.final-cta h2 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(40px, 5.4vw, 80px);
  line-height: 0.98;
  letter-spacing: -0.03em;
  margin: 0 0 18px;
  color: #fff;
  text-wrap: balance;
}
.final-cta h2 .sun { color: var(--snel-sun-500); }
.final-cta p {
  font-size: clamp(16px, 1.3vw, 19px);
  color: rgba(255,255,255,0.7);
  margin: 0 auto 32px;
  max-width: 56ch;
  line-height: 1.55;
}
.final-cta__ctas { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

/* risk + disclaimer */
.risk-disclaimer-section {
  padding-block: var(--space-12);
  background: var(--bg-page);
  border-top: 1px solid var(--border-1);
}
.risk-disclaimer-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 56px;
  align-items: start;
}
@media (max-width: 860px) { .risk-disclaimer-grid { grid-template-columns: 1fr; gap: 32px; } }
.risk-disclaimer-col__heading {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin: 0 0 14px;
  display: flex; align-items: center; gap: 6px;
}
.risk-disclaimer-col__heading-icon {
  display: inline-grid; place-items: center;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: var(--fg-3);
  color: #fff;
  font-size: 8px; font-weight: 800;
  flex-shrink: 0;
}
.risk-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.risk-list__item { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.55; color: var(--fg-2); }
.risk-list__num { flex-shrink: 0; color: var(--fg-3); font-size: 11px; padding-top: 1px; width: 20px; }
.disclaimer-body { font-size: 11px; line-height: 1.65; color: var(--fg-3); margin: 0; }
.disclaimer-body a { color: var(--fg-3); text-decoration: underline; text-underline-offset: 2px; }
.disclaimer-body strong { color: var(--fg-2); font-weight: 600; }

/* footer */
.site-footer {
  background: var(--snel-blue-900);
  color: rgba(255,255,255,0.6);
  padding-block: var(--space-12) var(--space-8);
}
.site-footer__main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: center;
  margin-bottom: var(--space-10);
  padding-bottom: var(--space-10);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.site-footer__logos { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
.site-footer__logos img { max-height: 28px; opacity: 0.95; filter: brightness(0) invert(1); }
.site-footer__logos img.snel { max-height: 22px; }
.anbima-badge { display: flex; align-items: center; }
.anbima-badge img { max-height: 44px; width: auto; filter: brightness(0) invert(1); opacity: 0.75; }
.site-footer__copy {
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.site-footer__cols {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 40px;
  margin-bottom: var(--space-10);
}
@media (max-width: 760px) { .site-footer__cols { grid-template-columns: 1fr; } }
.site-footer__col h5 {
  font-family: var(--font-display);
  font-weight: 600;
  color: #fff;
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin: 0 0 14px;
}
.site-footer__col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.site-footer__col a { font-size: 13.5px; color: rgba(255,255,255,0.62); transition: color var(--dur-fast); }
.site-footer__col a:hover { color: var(--snel-sun-500); }
.site-footer__col p { font-size: 13px; color: rgba(255,255,255,0.58); line-height: 1.55; }

/* fade-in on scroll */
.fade-in {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 700ms var(--ease-out), transform 700ms var(--ease-out);
}
.fade-in.visible { opacity: 1; transform: translateY(0); }

::selection { background: var(--snel-sun-500); color: var(--snel-blue-900); }


/* =========================================================
   V2 — Novos componentes
   ========================================================= */

/* Hero V2 */
.hero-v2 {
  position: relative;
  padding-block: clamp(56px, 8vw, 112px);
  overflow: hidden;
  background: var(--bg-page);
}
.hero-v2::before {
  content: '';
  position: absolute;
  width: 700px; height: 700px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(35,98,201,0.07), transparent 65%);
  top: -280px; right: -200px;
  pointer-events: none;
  z-index: 0;
}
.hero-v2::after {
  content: '';
  position: absolute;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(250,190,30,0.08), transparent 65%);
  bottom: -200px; left: -160px;
  pointer-events: none;
  z-index: 0;
}
.hero-v2 > * { position: relative; z-index: 1; }
.hero-v2-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 900px;
  margin: 0 auto;
}
.hero-v2-lockup {
  margin-bottom: 28px;
}
.hero-v2 h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(38px, 6vw, 84px);
  line-height: 0.97;
  letter-spacing: -0.03em;
  color: var(--snel-blue-900);
  margin: 0 0 22px;
  text-wrap: balance;
}
.hero-v2 h1 .sun { color: var(--snel-sun-500); font-style: italic; }

  <script type="text/babel">
/* global React, Icon */
const Container = ({ children, wide = false, className = '' }) =>
  <div className={`container ${wide ? 'container--wide' : ''} ${className}`}>{children}</div>;

const FadeIn = ({ children, delay = 0, as = 'div', ...rest }) => {
  const ref = React.useRef(null);
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    if (!ref.current) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          setTimeout(() => setVisible(true), delay);
          io.disconnect();
        }
      });
    }, { threshold: 0.12 });
    io.observe(ref.current);
    return () => io.disconnect();
  }, [delay]);
  const Tag = as;
  return (
    <Tag ref={ref} className={`fade-in ${visible ? 'visible' : ''} ${rest.className || ''}`} {...rest}>
      {children}
    </Tag>
  );
};
